name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          mkdir -p extracted

          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -1)

          if [ -z "$ZIP" ]; then
            echo "No ZIP file found"
            exit 1
          fi

          echo "Using ZIP: $ZIP"

          unzip -q "$ZIP" -d extracted

          PACKAGE=$(find extracted \
            -type f \
            -name "package.json" \
            -not -path "*/node_modules/*" | head -1)

          if [ -z "$PACKAGE" ]; then
            echo "package.json not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE")

          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build web app
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run build

      - name: Install Capacitor dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Check Capacitor configuration
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Project files:"
          ls -la

          if [ -f capacitor.config.ts ]; then
            echo "Found capacitor.config.ts"
          elif [ -f capacitor.config.js ]; then
            echo "Found capacitor.config.js"
          elif [ -f capacitor.config.json ]; then
            echo "Found capacitor.config.json"
          else
            echo "No Capacitor config found"
            exit 1
          fi

      - name: Add Android platform
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -d android ]; then
            echo "Android platform already exists"
          else
            npx cap add android
          fi

      - name: Sync Android
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npx cap sync android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Password-Card-Manager-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
